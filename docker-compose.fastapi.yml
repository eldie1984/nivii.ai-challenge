version: '3.8'

services:
  # Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: portfolio_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  # Redis for message queuing
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # API Gateway (FastAPI)
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile.fastapi
    ports:
      - "3001:3000"
    environment:
      - DEBUG=false
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/portfolio_tracker
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=your-jwt-secret-key-change-in-production
      - CRYPTOCURRENCY_SERVICE_URL=http://crypto-service:3005
      - PORTFOLIO_SERVICE_URL=http://portfolio-service:3002
      - AGENT_ORCHESTRATOR_URL=http://agent-service:3004
    depends_on:
      - postgres
      - redis
    volumes:
      - ./services/api-gateway:/app
    restart: unless-stopped

  # Portfolio Service (Node.js - unchanged)
  portfolio-service:
    build: ./services/portfolio
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/portfolio_tracker
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    volumes:
      - ./services/portfolio:/app
      - /app/node_modules

  # Transaction Service (Node.js - unchanged)
  transaction-service:
    build: ./services/transaction
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/portfolio_tracker
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    volumes:
      - ./services/transaction:/app
      - /app/node_modules

  # Agent Orchestrator Service (Node.js - unchanged)
  agent-service:
    build: ./services/agent-orchestrator
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/portfolio_tracker
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./services/agent-orchestrator:/app
      - /app/node_modules

  # Cryptocurrency Service (FastAPI)
  crypto-service:
    build:
      context: ./services/cryptocurrency
      dockerfile: Dockerfile.fastapi
    ports:
      - "3005:3005"
    environment:
      - DEBUG=false
      - COINGECKO_API_URL=https://api.coingecko.com/api/v3
      - COINMARKETCAP_API_URL=https://pro-api.coinmarketcap.com/v1
      - COINMARKETCAP_API_KEY=${COINMARKETCAP_API_KEY}
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - COINBASE_API_KEY=${COINBASE_API_KEY}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./services/cryptocurrency:/app
    restart: unless-stopped

  # Frontend
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NODE_ENV=production
    depends_on:
      - api-gateway

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - api-gateway

  # Monitoring
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    ports:
      - "3006:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  grafana_data:
