global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:3001']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'portfolio-service'
    static_configs:
      - targets: ['portfolio-service:3002']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'transaction-service'
    static_configs:
      - targets: ['transaction-service:3003']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'agent-service'
    static_configs:
      - targets: ['agent-service:3004']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'crypto-service'
    static_configs:
      - targets: ['crypto-service:3005']
    metrics_path: '/metrics'
    scrape_interval: 15s
