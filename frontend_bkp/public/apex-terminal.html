<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>APEX Markets — Trading Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Design tokens — shared across all components */
:root {
  --bg: #030608;
  --surface: #0a0e13;
  --surface2: #111820;
  --border: #1a2535;
  --accent: #00e5ff;
  --text: #e8f0fe;
  --muted: #4a6080;
  --gain: #00ff9d;
  --loss: #ff3d71;
  --hold: #ffd700;
  --mono: 'Space Mono', monospace;
  --sans: 'Syne', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100vh;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 229, 255, 0.012) 2px, rgba(0, 229, 255, 0.012) 4px);
  pointer-events: none;
  z-index: 9999;
}

::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Common animations */
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
@keyframes flash-gain { 0% { background: rgba(0, 255, 157, 0.15); } 100% { background: transparent; } }
@keyframes flash-loss { 0% { background: rgba(255, 61, 113, 0.15); } 100% { background: transparent; } }
.flash-g { animation: flash-gain 0.7s ease-out; }
.flash-l { animation: flash-loss 0.7s ease-out; }

/* Shared col chrome */
.col {
  border-right: 1px solid var(--border);
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
  display: flex;
  flex-direction: column;
}
.col:last-child { border-right: none; }
.col-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: var(--surface);
  z-index: 10;
  flex-shrink: 0;
}
.col-title {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--muted);
}
.col-meta { font-family: var(--mono); font-size: 8px; color: var(--muted); }
.empty {
  padding: 24px 16px;
  font-size: 10px;
  color: var(--muted);
  font-family: var(--mono);
  text-align: center;
}

</style>
<style>
/* Header + ticker */
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px;
  border-bottom: 1px solid var(--border);
  background: rgba(10, 14, 19, 0.97);
  backdrop-filter: blur(12px);
  position: sticky; top: 0; z-index: 50;
  height: 52px;
}
.logo {
  font-size: 18px; font-weight: 800;
  color: var(--accent);
  text-shadow: 0 0 18px rgba(0, 229, 255, 0.4);
  letter-spacing: -0.5px;
}
.logo span { color: var(--text); }
.nav-tabs { display: flex; gap: 0; height: 100%; }
.nav-tab {
  display: flex; align-items: center;
  padding: 0 20px;
  font-family: var(--mono); font-size: 10px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  text-decoration: none;
  transition: all 0.15s;
}
.nav-tab:hover { color: var(--text); }
.nav-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.header-right {
  display: flex; align-items: center; gap: 16px;
  font-family: var(--mono); font-size: 10px; color: var(--muted);
}
.status-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--gain);
  box-shadow: 0 0 6px var(--gain);
  animation: pulse 2s infinite;
  display: inline-block; margin-right: 4px;
}
.header-time { color: var(--accent); font-size: 11px; }

.ticker-wrap {
  overflow: hidden;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 5px 0;
}
.ticker-tape {
  display: flex; gap: 36px;
  animation: ticker 32s linear infinite;
  white-space: nowrap;
  font-family: var(--mono); font-size: 10px;
}
@keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
.tick-sym { color: var(--accent); font-weight: 700; }
.tick-chg.up { color: var(--gain); }
.tick-chg.dn { color: var(--loss); }

/* Watchlist (shared) */
.wl-item {
  padding: 12px 16px;
  border-bottom: 1px solid rgba(26, 37, 53, 0.5);
  cursor: pointer;
  transition: background 0.15s;
  display: grid; grid-template-columns: 1fr auto; gap: 4px;
  align-items: center;
  flex-shrink: 0;
}
.wl-item:hover { background: var(--surface2); }
.wl-item.active { background: rgba(0, 229, 255, 0.05); border-left: 2px solid var(--accent); }
.wl-sym { font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.wl-badge {
  font-size: 7px; padding: 2px 4px; border-radius: 2px;
  font-family: var(--mono); font-weight: 700; letter-spacing: 1px;
}
.wl-badge.BUY { background: rgba(0, 255, 157, 0.15); color: var(--gain); border: 1px solid rgba(0, 255, 157, 0.3); }
.wl-badge.SELL { background: rgba(255, 61, 113, 0.15); color: var(--loss); border: 1px solid rgba(255, 61, 113, 0.3); }
.wl-badge.HOLD { background: rgba(255, 215, 0, 0.12); color: var(--hold); border: 1px solid rgba(255, 215, 0, 0.3); }
.wl-name { font-size: 9px; color: var(--muted); font-family: var(--mono); margin-top: 2px; }
.wl-price { font-family: var(--mono); font-size: 12px; text-align: right; }
.wl-chg { font-family: var(--mono); font-size: 9px; text-align: right; }

</style>
<style>
/* Terminal-specific layout + components */

/* Chart area */
.chart-col { display: flex; flex-direction: column; overflow: hidden; }
.chart-area { padding: 14px 16px; flex-shrink: 0; }
.chart-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; }
.chart-symbol { font-size: 22px; font-weight: 800; letter-spacing: -1px; }
.chart-company { font-size: 9px; color: var(--muted); margin-top: 2px; }
.chart-price-big { font-family: var(--mono); font-size: 24px; font-weight: 700; }
.chart-change-big { font-family: var(--mono); font-size: 11px; text-align: right; margin-top: 3px; }
canvas { width: 100%; border-radius: 3px; }
.timeframes { display: flex; gap: 3px; margin-bottom: 8px; }
.tf-btn {
  font-family: var(--mono); font-size: 9px; padding: 3px 8px;
  background: transparent; border: 1px solid var(--border); color: var(--muted);
  cursor: pointer; border-radius: 2px; transition: all 0.15s;
}
.tf-btn:hover { border-color: var(--accent); color: var(--accent); }
.tf-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700; }

/* Agent panel */
.agent-panel {
  border-top: 1px solid var(--border);
  flex: 1; display: flex; flex-direction: column;
  overflow: hidden; background: var(--surface);
}
.agent-header {
  padding: 10px 14px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
}
.agent-icon {
  width: 24px; height: 24px; border-radius: 50%;
  background: linear-gradient(135deg, rgba(0, 229, 255, 0.2), rgba(0, 255, 157, 0.1));
  border: 1px solid rgba(0, 229, 255, 0.4);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px;
  animation: aglow 3s ease-in-out infinite;
}
@keyframes aglow {
  0%, 100% { box-shadow: 0 0 8px rgba(0, 229, 255, 0.15); }
  50% { box-shadow: 0 0 18px rgba(0, 229, 255, 0.35); }
}
.agent-name { font-size: 11px; font-weight: 700; }
.agent-sub { font-size: 7px; color: var(--muted); font-family: var(--mono); }
.agent-status { font-family: var(--mono); font-size: 8px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.agent-status-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gain); box-shadow: 0 0 5px var(--gain); }

.signal-box { padding: 12px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.big-signal { font-size: 26px; font-weight: 800; letter-spacing: 3px; transition: all 0.3s; }
.big-signal.BUY { color: var(--gain); text-shadow: 0 0 20px rgba(0, 255, 157, 0.4); }
.big-signal.SELL { color: var(--loss); text-shadow: 0 0 20px rgba(255, 61, 113, 0.4); }
.big-signal.HOLD { color: var(--hold); text-shadow: 0 0 18px rgba(255, 215, 0, 0.3); }
.big-signal.--- { color: var(--muted); }
.conf-bar-wrap { flex: 1; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
.conf-bar-fill { height: 100%; border-radius: 2px; transition: width 0.6s; }

.trade-cost-card { border-bottom: 1px solid var(--border); background: var(--surface2); flex-shrink: 0; font-family: var(--mono); font-size: 10px; }
.tc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); }
.tc-cell { background: var(--surface2); padding: 6px 11px; }
.tc-label { font-size: 7px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
.tc-value { font-size: 11px; font-weight: 700; margin-top: 2px; }
.tc-full { background: var(--surface2); padding: 6px 11px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }

.indicators {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
  background: var(--border);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.indicator-card { background: var(--surface); padding: 8px 10px; }
.ind-label { font-size: 7px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; font-family: var(--mono); }
.ind-value { font-family: var(--mono); font-size: 12px; font-weight: 700; margin-top: 2px; }
.ind-sig { font-size: 7px; font-family: var(--mono); margin-top: 2px; }

.agent-reasoning {
  flex: 1; overflow-y: auto;
  padding: 11px 14px;
  scrollbar-width: thin; scrollbar-color: var(--border) transparent;
}
.reasoning-label { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); font-family: var(--mono); margin-bottom: 7px; }
.reasoning-text { font-size: 11px; line-height: 1.8; color: var(--text); font-family: var(--mono); white-space: pre-wrap; }
.reasoning-cursor { display: inline-block; width: 7px; height: 12px; background: var(--accent); animation: blink 0.8s step-end infinite; vertical-align: middle; margin-left: 2px; }

.agent-actions { padding: 10px 14px; border-top: 1px solid var(--border); flex-shrink: 0; display: flex; gap: 6px; }
.agent-btn {
  flex: 1; padding: 8px;
  border: 1px solid var(--border); background: transparent; color: var(--muted);
  font-family: var(--sans); font-size: 10px; font-weight: 600; letter-spacing: 1px;
  text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: all 0.15s;
}
.agent-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); background: rgba(0, 229, 255, 0.05); }
.agent-btn.primary { background: rgba(0, 229, 255, 0.08); border-color: var(--accent); color: var(--accent); }
.agent-btn.exec-buy { border-color: var(--gain); color: var(--gain); background: rgba(0, 255, 157, 0.07); }
.agent-btn.exec-sell { border-color: var(--loss); color: var(--loss); background: rgba(255, 61, 113, 0.07); }
.agent-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* Order entry */
.order-col { display: flex; flex-direction: column; overflow: hidden; background: var(--surface); }
.cash-display { padding: 14px 16px; border-bottom: 1px solid var(--border); font-family: var(--mono); flex-shrink: 0; }
.cash-label { font-size: 7px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
.cash-value { font-size: 20px; font-weight: 700; color: var(--text); margin-top: 3px; }
.order-section { padding: 14px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.os-title { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); font-family: var(--mono); margin-bottom: 10px; }
.order-tabs { display: flex; margin-bottom: 10px; border: 1px solid var(--border); border-radius: 2px; overflow: hidden; }
.order-tab {
  flex: 1; padding: 7px;
  background: transparent; border: none;
  font-family: var(--sans); font-size: 10px; font-weight: 600;
  cursor: pointer; color: var(--muted); transition: all 0.15s;
  text-transform: uppercase; letter-spacing: 1px;
}
.order-tab.buy.active { background: var(--gain); color: var(--bg); }
.order-tab.sell.active { background: var(--loss); color: white; }
.order-tab:hover:not(.active) { background: var(--surface2); color: var(--text); }
.field-group { display: flex; flex-direction: column; gap: 3px; margin-bottom: 8px; }
.field-label { font-size: 7px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); font-family: var(--mono); }
.field-input {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  font-family: var(--mono); font-size: 12px; padding: 7px 9px; border-radius: 2px;
  transition: border-color 0.15s; width: 100%;
}
.field-input:focus { outline: none; border-color: var(--accent); }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.order-summary {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 2px;
  padding: 8px 10px; margin: 8px 0;
  font-family: var(--mono); font-size: 10px;
  display: flex; justify-content: space-between; color: var(--muted);
}
.order-btn {
  width: 100%; padding: 10px; border: none; border-radius: 2px;
  font-family: var(--sans); font-size: 12px; font-weight: 700; letter-spacing: 2px;
  text-transform: uppercase; cursor: pointer; transition: all 0.2s;
}
.order-btn.buy { background: var(--gain); color: var(--bg); }
.order-btn.sell { background: var(--loss); color: white; }
.order-btn:hover { transform: translateY(-1px); }

/* Holdings mini */
.holding-mini {
  padding: 9px 14px; border-bottom: 1px solid rgba(26, 37, 53, 0.4);
  display: grid; grid-template-columns: auto 1fr auto; gap: 8px;
  align-items: center; flex-shrink: 0;
}
.hm-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.hm-sym { font-weight: 700; font-size: 11px; }
.hm-shares { font-size: 8px; color: var(--muted); font-family: var(--mono); }
.hm-val { font-family: var(--mono); font-size: 10px; text-align: right; }
.hm-pnl { font-family: var(--mono); font-size: 8px; text-align: right; }

/* Order book */
.ob-col { display: flex; flex-direction: column; overflow: hidden; font-family: var(--mono); }
.ob-spread-row { padding: 5px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; font-size: 9px; }
.ob-col-hdr { display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 4px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.ob-col-hdr span { font-size: 7px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.ob-col-hdr span:nth-child(2) { text-align: center; }
.ob-col-hdr span:last-child { text-align: right; }
.ob-asks, .ob-bids { flex-shrink: 0; }
.ob-row {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  padding: 3px 12px; position: relative; cursor: pointer; transition: opacity 0.15s;
}
.ob-row:hover { opacity: 0.7; }
.ob-row .ob-price { font-size: 10px; font-weight: 700; }
.ob-row .ob-size { font-size: 9px; text-align: center; color: var(--text); }
.ob-row .ob-total { font-size: 9px; text-align: right; color: var(--muted); }
.ob-row .ob-depth-bar { position: absolute; top: 0; bottom: 0; right: 0; opacity: 0.11; pointer-events: none; transition: width 0.3s; }
.ob-row.ask .ob-price { color: var(--loss); }
.ob-row.ask .ob-depth-bar { background: var(--loss); }
.ob-row.bid .ob-price { color: var(--gain); }
.ob-row.bid .ob-depth-bar { background: var(--gain); }
.ob-mid-row {
  border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  padding: 5px 12px; display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0; background: rgba(0, 229, 255, 0.03);
}
.ob-last-price { font-size: 13px; font-weight: 700; }
.ob-imbalance { padding: 6px 12px; border-top: 1px solid var(--border); flex-shrink: 0; }
.ob-imb-bar { height: 4px; border-radius: 2px; display: flex; overflow: hidden; margin: 4px 0; }
.ob-imb-bid { background: var(--gain); transition: width 0.5s; }
.ob-imb-ask { background: var(--loss); transition: width 0.5s; }
.ob-imb-labels { display: flex; justify-content: space-between; font-size: 8px; }
.ob-imb-labels span:first-child { color: var(--gain); }
.ob-imb-labels span:last-child { color: var(--loss); }
.ob-tape-hdr { padding: 6px 12px 4px; border-top: 1px solid var(--border); flex-shrink: 0; }
.ob-tape { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
.ob-trade-row {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  padding: 3px 12px; border-bottom: 1px solid rgba(26, 37, 53, 0.3);
  font-size: 9px; animation: fadeIn 0.2s ease-out;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: translateY(0); } }
.ob-trade-row.buy .ob-t-price { color: var(--gain); font-weight: 700; }
.ob-trade-row.sell .ob-t-price { color: var(--loss); font-weight: 700; }
.ob-t-size { text-align: center; color: var(--muted); }
.ob-t-time { text-align: right; color: var(--muted); font-size: 8px; }

.act-mini {
  padding: 8px 14px; border-bottom: 1px solid rgba(26, 37, 53, 0.3);
  display: flex; gap: 6px; align-items: flex-start;
}
.act-mini .act-icon { width: 16px; height: 16px; }
.act-mini .act-text { font-size: 9px; line-height: 1.5; flex: 1; }
.act-mini .act-time { font-size: 7px; }

.open-order-item {
  padding: 10px 16px; border-bottom: 1px solid rgba(26, 37, 53, 0.4);
  display: grid; grid-template-columns: auto 1fr auto; gap: 10px;
  align-items: center; font-family: var(--mono); font-size: 10px;
}

</style>
<style>
/* Auth + Prefs page styles */
.auth-shell {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 40px 20px;
  background:
    radial-gradient(ellipse at top, rgba(0, 229, 255, 0.06), transparent 60%),
    radial-gradient(ellipse at bottom, rgba(0, 255, 157, 0.04), transparent 60%);
}
.auth-card {
  width: 100%; max-width: 420px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  box-shadow: 0 0 60px rgba(0, 229, 255, 0.08), inset 0 1px 0 rgba(255,255,255,0.03);
  overflow: hidden;
}
.auth-brand {
  text-align: center;
  padding: 28px 28px 20px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(0, 229, 255, 0.04), transparent);
}
.auth-brand .logo {
  font-family: var(--sans); font-size: 22px; font-weight: 800;
  color: var(--accent);
  text-shadow: 0 0 24px rgba(0, 229, 255, 0.4);
  letter-spacing: -0.5px;
}
.auth-brand .logo span { color: var(--text); }
.auth-brand .tag {
  font-family: var(--mono); font-size: 9px;
  letter-spacing: 3px; text-transform: uppercase;
  color: var(--muted); margin-top: 6px;
}
.auth-tabs { display: flex; }
.auth-tab {
  flex: 1; padding: 14px; background: transparent; border: none;
  font-family: var(--sans); font-size: 11px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase;
  color: var(--muted); cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
}
.auth-tab:hover { color: var(--text); }
.auth-tab.active { color: var(--accent); border-bottom-color: var(--accent); background: rgba(0, 229, 255, 0.04); }
.auth-form { padding: 22px 28px 26px; display: none; }
.auth-form.active { display: block; }
.auth-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
.auth-label {
  font-family: var(--mono); font-size: 8px;
  letter-spacing: 2px; text-transform: uppercase; color: var(--muted);
}
.auth-input {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  font-family: var(--mono); font-size: 13px;
  padding: 10px 12px; border-radius: 2px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.auth-input:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.1);
}
.auth-btn {
  width: 100%; padding: 12px;
  background: var(--accent); color: var(--bg); border: none; border-radius: 2px;
  font-family: var(--sans); font-size: 12px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase; cursor: pointer;
  transition: all 0.15s;
}
.auth-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0, 229, 255, 0.3); }

// Event bus — decouples services from components.
// Services publish, components subscribe.
window.APEX = window.APEX || {};
APEX.bus = (function () {
  const handlers = {};
  return {
    on(evt, fn) {
      (handlers[evt] = handlers[evt] || []).push(fn);
      return () => this.off(evt, fn);
    },
    off(evt, fn) {
      handlers[evt] = (handlers[evt] || []).filter(h => h !== fn);
    },
    emit(evt, payload) {
      (handlers[evt] || []).forEach(fn => {
        try { fn(payload); } catch (e) { console.error('[bus]', evt, e); }
      });
    },
  };
})();

</script>

// Auth service — signup, login, logout, current user, preferences
window.APEX = window.APEX || {};
APEX.auth = (function () {
  const USERS_KEY = 'apex_users';
  const SESSION_KEY = 'apex_session';
  const PREFS_KEY = 'apex_prefs';

  const DEFAULT_PREFS = {
    displayName: '',
    email: '',
    riskTolerance: 'moderate',         // conservative | moderate | aggressive
    defaultOrderType: 'MARKET',
    defaultQty: 10,
    confirmOrders: true,
    notifySignals: true,
    notifyFills: true,
    theme: 'cyber',                    // cyber | minimal
    autoAnalyze: false,
    baseCurrency: 'USD',
    sessionTimeoutMin: 60,
  };

  function loadUsers() {
    try { return JSON.parse(localStorage.getItem(USERS_KEY)) || {}; } catch { return {}; }
  }
  function saveUsers(u) { localStorage.setItem(USERS_KEY, JSON.stringify(u)); }

  function hash(s) {
    // tiny non-cryptographic hash — good enough for a prototype
    let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h) ^ s.charCodeAt(i);
    return (h >>> 0).toString(16);
  }

  function signup({ email, password, displayName }) {
    email = (email || '').trim().toLowerCase();
    if (!email || !password) throw new Error('Email and password required.');
    if (password.length < 6) throw new Error('Password must be at least 6 characters.');
    const users = loadUsers();
    if (users[email]) throw new Error('An account with that email already exists.');
    users[email] = { email, displayName: displayName || email.split('@')[0], pwHash: hash(password), createdAt: new Date().toISOString() };
    saveUsers(users);
    setSession(email);
    setPrefs({ ...DEFAULT_PREFS, email, displayName: users[email].displayName });
    return users[email];
  }

  function login({ email, password }) {
    email = (email || '').trim().toLowerCase();
    const users = loadUsers();
    const u = users[email];
    if (!u || u.pwHash !== hash(password)) throw new Error('Invalid email or password.');
    setSession(email);
    if (!getPrefs()) setPrefs({ ...DEFAULT_PREFS, email, displayName: u.displayName });
    return u;
  }

  function logout() {
    localStorage.removeItem(SESSION_KEY);
    APEX.bus && APEX.bus.emit('auth:logout');
  }

  function setSession(email) {
    localStorage.setItem(SESSION_KEY, JSON.stringify({ email, ts: Date.now() }));
    APEX.bus && APEX.bus.emit('auth:login', { email });
  }

  function current() {
    try {
      const s = JSON.parse(localStorage.getItem(SESSION_KEY));
      if (!s) return null;
      const u = loadUsers()[s.email];
      return u || null;
    } catch { return null; }
  }

  function requireAuth(redirect = 'Login.html') {
    if (!current()) { window.location.href = redirect; return false; }
    return true;
  }

  function getPrefs() {
    try { return JSON.parse(localStorage.getItem(PREFS_KEY)); } catch { return null; }
  }
  function setPrefs(p) {
    localStorage.setItem(PREFS_KEY, JSON.stringify(p));
    APEX.bus && APEX.bus.emit('prefs:changed', p);
  }
  function updatePrefs(patch) {
    const p = { ...(getPrefs() || DEFAULT_PREFS), ...patch };
    setPrefs(p); return p;
  }

  return { signup, login, logout, current, requireAuth, getPrefs, setPrefs, updatePrefs, DEFAULT_PREFS };
})();

</script>

// State service — holdings, cash, activity, signals. Persisted to localStorage.
window.APEX = window.APEX || {};
APEX.state = (function () {
  const KEY = 'apex_state';
  const DEFAULT = { holdings: {}, cashBalance: 50000, activityEvents: [], agentSignals: {}, orderCount: 0 };
  let state;
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      state = s ? { ...DEFAULT, ...s } : { ...DEFAULT };
    } catch { state = { ...DEFAULT }; }
  }
  function save() {
    localStorage.setItem(KEY, JSON.stringify(state));
    APEX.bus.emit('state:changed', state);
  }
  load();

  function get() { return state; }
  function reload() { load(); APEX.bus.emit('state:changed', state); }

  function addActivity(type, text) {
    state.activityEvents.unshift({ type, text, time: new Date().toISOString() });
    if (state.activityEvents.length > 30) state.activityEvents.pop();
    save();
    APEX.bus.emit('activity:added', { type, text });
  }
  function setSignal(sym, sig) {
    state.agentSignals[sym] = sig;
    save();
    APEX.bus.emit('signal:set', { sym, sig });
  }
  function applyBuy(sym, qty, price, color) {
    if (!state.holdings[sym]) state.holdings[sym] = { qty: 0, avgCost: 0, color };
    const h = state.holdings[sym], nq = h.qty + qty;
    h.avgCost = (h.avgCost * h.qty + price * qty) / nq;
    h.qty = nq;
    state.cashBalance -= price * qty;
    state.orderCount++;
    save();
  }
  function applySell(sym, qty, price) {
    if (state.holdings[sym]) {
      state.holdings[sym].qty = Math.max(0, state.holdings[sym].qty - qty);
      if (!state.holdings[sym].qty) delete state.holdings[sym];
    }
    state.cashBalance += price * qty;
    state.orderCount++;
    save();
  }

  // Cross-tab sync
  window.addEventListener('storage', e => {
    if (e.key === KEY) { load(); APEX.bus.emit('state:changed', state); }
    if (e.key === 'apex_stocks') { APEX.stocks.reload(); APEX.bus.emit('stocks:tick', APEX.stocks.all()); }
  });

  return { get, save, reload, addActivity, setSignal, applyBuy, applySell };
})();

  <script>
// Trade cost calculator — pure functions
window.APEX = window.APEX || {};
APEX.costs = (function () {
  const COMMISSION = 0.65, COMMISSION_MIN = 1.00, SLIPPAGE_BPS = 3;
  function calc(price, qty) {
    const gross = price * qty;
    const commission = Math.max(COMMISSION_MIN, COMMISSION * qty);
    const slippage = gross * (SLIPPAGE_BPS / 10000);
    return { gross, commission, slippage, totalCost: gross + commission + slippage, totalProceeds: gross - commission - slippage };
  }
  function suggest(stock, signal, cashBalance, holding) {
    let qty;
    if (signal === 'BUY') qty = Math.max(1, Math.floor(Math.min(cashBalance * 0.10, 5000) / stock.price));
    else if (signal === 'SELL') qty = holding ? holding.qty : 0;
    else qty = Math.max(1, Math.floor(Math.min(cashBalance * 0.05, 2000) / stock.price));
    const c = calc(stock.price, qty);
    const breakeven = stock.price + (c.commission + c.slippage) / Math.max(qty, 1);
    let projectedPnl = null, projectedPct = null;
    if (holding && holding.qty > 0 && signal === 'SELL') {
      const cb = holding.avgCost * qty;
      projectedPnl = c.totalProceeds - cb;
      projectedPct = projectedPnl / cb * 100;
    }
    return { ...c, price: stock.price, suggestedQty: qty, breakeven, projectedPnl, projectedPct, holding };
  }
  return { calc, suggest, COMMISSION, COMMISSION_MIN, SLIPPAGE_BPS };
})();

  <script>
// Order book service — generates synthetic L2 + tape
window.APEX = window.APEX || {};
APEX.orderbook = (function () {
  const LEVELS = 8;
  let trades = [];

  function generate(stock) {
    const mid = stock.price;
    const spread = mid * 0.0002 + 0.01;
    const tick = mid < 10 ? 0.01 : mid < 100 ? 0.05 : 0.10;
    const asks = [], bids = [];
    for (let i = 0; i < LEVELS; i++) {
      asks.push({ price: mid + spread / 2 + tick * i + Math.random() * tick * 0.5, size: Math.floor(100 + Math.random() * 2400) });
      bids.push({ price: mid - spread / 2 - tick * i - Math.random() * tick * 0.5, size: Math.floor(100 + Math.random() * 2400) });
    }
    asks.sort((a, b) => a.price - b.price);
    bids.sort((a, b) => b.price - a.price);
    let at = 0; asks.forEach(a => { at += a.size; a.total = at; });
    let bt = 0; bids.forEach(b => { bt += b.size; b.total = bt; });
    const maxT = Math.max(at, bt);
    asks.forEach(a => a.dp = (a.total / maxT * 100).toFixed(0));
    bids.forEach(b => b.dp = (b.total / maxT * 100).toFixed(0));
    const totalBid = bids.reduce((s, b) => s + b.size, 0);
    const totalAsk = asks.reduce((s, a) => s + a.size, 0);
    const tot = totalBid + totalAsk;
    return {
      asks, bids,
      bestAsk: asks[0].price, bestBid: bids[0].price,
      spreadVal: asks[0].price - bids[0].price, mid,
      bidPct: (totalBid / tot * 100).toFixed(0),
      askPct: (totalAsk / tot * 100).toFixed(0),
    };
  }

  function recordTrade(ob) {
    const dir = Math.random() > 0.5 ? 'buy' : 'sell';
    const price = dir === 'buy' ? ob.bestAsk : ob.bestBid;
    const size = Math.floor(100 + Math.random() * 800);
    trades.unshift({ dir, price, size, time: new Date() });
    if (trades.length > 40) trades.pop();
    return { dir, price, size };
  }

  function getTrades() { return trades; }
  function reset() { trades = []; }

  return { generate, recordTrade, getTrades, reset };
})();

// Agent service — wraps Claude call + prompt building
window.APEX = window.APEX || {};
APEX.agent = (function () {
  function buildPrompt(s, inds, cashBalance, holdings, buyCosts, sellCosts) {
    const high52 = (s.price * (1.14 + Math.random() * 0.22)).toFixed(2);
    const low52 = (s.price * (0.67 + Math.random() * 0.18)).toFixed(2);
    const fromHigh = (((s.price / high52) - 1) * 100).toFixed(1);
    const holdingInfo = holdings[s.sym] ? `${holdings[s.sym].qty} shares at avg $${holdings[s.sym].avgCost.toFixed(2)}` : 'No position';
    const buyBlock = `BUY (${buyCosts.suggestedQty} shares): gross $${buyCosts.gross.toLocaleString('en-US', { maximumFractionDigits: 0 })}, commission $${buyCosts.commission.toFixed(2)}, slippage $${buyCosts.slippage.toFixed(2)}, TOTAL OUTLAY $${buyCosts.totalCost.toLocaleString('en-US', { minimumFractionDigits: 2 })}, breakeven $${buyCosts.breakeven.toFixed(2)}/sh`;
    const sellBlock = sellCosts ? `SELL (${sellCosts.suggestedQty} shares): gross $${sellCosts.gross.toLocaleString('en-US', { maximumFractionDigits: 0 })}, commission $${sellCosts.commission.toFixed(2)}, slippage $${sellCosts.slippage.toFixed(2)}, NET $${sellCosts.totalProceeds.toLocaleString('en-US', { minimumFractionDigits: 2 })}, P&L ${sellCosts.projectedPnl >= 0 ? '+' : ''}$${(sellCosts.projectedPnl || 0).toFixed(2)} (${(sellCosts.projectedPct || 0).toFixed(2)}%)` : 'SELL: no position held';

    return `You are APEX, a professional algorithmic trading agent.

STOCK: ${s.sym} — ${s.name} | Sector: ${s.sector} | P/E: ${s.pe} | Cap: ${s.mktCap}
Price: $${s.price.toFixed(2)} | Day: ${s.chg > 0 ? '+' : ''}${s.chg.toFixed(2)}% | 52W High: $${high52} (${fromHigh}% below) | 52W Low: $${low52}

TECHNICALS: RSI ${inds.rsi} (${inds.rsiSig}) | MACD ${inds.macd} (${inds.macdSig}) | Momentum ${inds.mom}% (${inds.momSig})

PORTFOLIO: Cash $${cashBalance.toLocaleString()} | Position: ${holdingInfo}

TRADE COSTS:
${buyBlock}
${sellBlock}

FORMAT (exactly):
Line 1: BUY, SELL, or HOLD
Line 2: Confidence: XX%
Lines 3+: 4–5 sentences. Must include: (a) what the technicals say, (b) a specific price target or stop-loss, (c) explicit mention of the total cost or net proceeds and whether the trade makes financial sense given the costs. Max 190 words. Be direct and actionable.`;
  }

  function parse(fullText) {
    const lines = fullText.trim().split('\n');
    let signal = 'HOLD';
    for (const l of lines) {
      const t = l.trim().toUpperCase();
      if (t === 'BUY' || t === 'SELL' || t === 'HOLD') { signal = t; break; }
    }
    const cm = fullText.match(/[Cc]onfidence[:\s]+(\d+)/);
    const confidence = cm ? parseInt(cm[1]) : 72;
    return { signal, confidence };
  }

  async function analyze(prompt) {
    return await window.claude.complete({ messages: [{ role: 'user', content: prompt }] });
  }

  return { buildPrompt, parse, analyze };
})();

      </div>

    const canvas = root.querySelector('#priceChart');
    function generate(base, pts) {
      const d = [base * (0.93 + Math.random() * 0.05)];
      for (let i = 1; i < pts; i++) d.push(Math.max(d[i-1] + (Math.random()-0.48) * d[i-1] * 0.011, 1));

      canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
      ctx.scale(devicePixelRatio, devicePixelRatio);
      const pts = 60, data = generate(stock.price, pts);
      const min = Math.min(...data) * 0.999, max = Math.max(...data) * 1.001;
      const xS = W / (pts - 1), yS = v => H - ((v-min)/(max-min)) * H * 0.84 - H * 0.08;
      ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(26,37,53,0.7)'; ctx.lineWidth = 1;
      for (let i = 0; i <= 3; i++) { const y = H * 0.08 + (H * 0.84 / 3) * i; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
      const isUp = data[pts-1] >= data[0], lc = isUp ? '#00ff9d' : '#ff3d71';

      ctx.beginPath(); ctx.moveTo(0, yS(data[0]));
      data.forEach((v,i) => ctx.lineTo(i*xS, yS(v)));
      ctx.strokeStyle = lc; ctx.lineWidth = 2; ctx.shadowColor = lc; ctx.shadowBlur = 5; ctx.stroke(); ctx.shadowBlur = 0;
      ctx.beginPath(); ctx.arc((pts-1)*xS, yS(stock.price), 4, 0, Math.PI*2);

    async function analyze() {
      if (isAnalyzing) return;
      const s = getStock(); if (!s) return;

      $('analyzeBtn').disabled = true; $('execBuyBtn').disabled = true; $('execSellBtn').disabled = true;
      $('bigSignal').textContent = '...'; $('bigSignal').className = 'big-signal ---';

      const { holdings, cashBalance } = APEX.state.get();
      const buyCosts = APEX.costs.suggest(s, 'BUY', cashBalance, holdings[s.sym]);
      const sellCosts = holdings[s.sym] ? APEX.costs.suggest(s, 'SELL', cashBalance, holdings[s.sym]) : null;
      const prompt = APEX.agent.buildPrompt(s, inds, cashBalance, holdings, buyCosts, sellCosts);

      try {
        const fullText = await APEX.agent.analyze(prompt);
        await stream(fullText, s);
      } catch (err) {
        root.querySelector('#reasoningText').textContent = `Agent error: ${err.message}\n\nPlease try again.`;
        $('agentStatusText').textContent = 'ERROR';
      }
      isAnalyzing = false;
      $('analyzeBtn').disabled = false;
      $('agentStatusText').textContent = 'READY';
    }

    async function stream(fullText, stock) {
      const { signal, confidence } = APEX.agent.parse(fullText);
      const sigEl = $('bigSignal');
      sigEl.textContent = signal; sigEl.className = `big-signal ${signal}`;
      const cc = APEX.fmt.signalColor(signal);
      $('confPct').textContent = `${confidence}% conf`;
      $('confFill').style.cssText = `width:${confidence}%;background:${cc}`;
      $('sigUpdated').textContent = new Date().toLocaleTimeString();
      $('execBuyBtn').disabled = signal !== 'BUY';
      $('execSellBtn').disabled = signal !== 'SELL';
      APEX.state.setSignal(stock.sym, { signal, confidence, text: fullText, time: new Date().toISOString() });
      renderTC(stock, signal);

      const textEl = root.querySelector('#reasoningText');
      textEl.style.color = 'var(--text)';
      let displayed = ''; textEl.innerHTML = '<span class="reasoning-cursor"></span>';
      for (let i = 0; i < fullText.length; i++) {
        displayed += fullText[i];
        textEl.innerHTML = displayed.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '<span class="reasoning-cursor"></span>';
        $('agentReasoning').scrollTop = 99999;
        await new Promise(r => setTimeout(r, fullText[i] === '\n' ? 30 : 10));
      }
      textEl.innerHTML = displayed.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

      const { holdings, cashBalance } = APEX.state.get();
      const buyC = APEX.costs.suggest(stock, signal, cashBalance, holdings[stock.sym]);
      const note = signal === 'BUY' ? ` · Outlay $${buyC.totalCost.toLocaleString('en-US',{maximumFractionDigits:0})} · BE $${buyC.breakeven.toFixed(2)}`
        : signal === 'SELL' && holdings[stock.sym] ? ` · Net $${APEX.costs.suggest(stock,'SELL',cashBalance,holdings[stock.sym]).totalProceeds.toLocaleString('en-US',{maximumFractionDigits:0})}` : '';
      APEX.state.addActivity('ai', `<span class="act-sym">AGENT→${stock.sym}</span> <strong style="color:${cc}">${signal}</strong> (${confidence}%)${note}`);
    }

    $('analyzeBtn').addEventListener('click', analyze);
    $('execBuyBtn').addEventListener('click', () => APEX.bus.emit('agent:execute', 'buy'));
    $('execSellBtn').addEventListener('click', () => APEX.bus.emit('agent:execute', 'sell'));

    APEX.bus.on('symbol:selected', () => {
      const s = getStock(); if (!s) return;
      const cached = APEX.state.get().agentSignals[s.sym];
      if (cached) showCached(cached, s); else reset();
    });

    return { reset, showCached };
  },
};

// ── Order Form ──
APEX.components.OrderForm = {
  mount(root, { getStock }) {
    let orderSide = 'buy';
    root.innerHTML = `
      <div class="cash-display">
        <div class="cash-label">Available Cash</div>
        <div class="cash-value" id="cashDisplay">$50,000.00</div>
      </div>
      <div class="order-section">
        <div class="os-title">New Order</div>
        <div class="order-tabs">
          <button class="order-tab buy active" id="buyTab">Buy</button>
          <button class="order-tab sell" id="sellTab">Sell</button>
        </div>
        <div class="field-group">
          <label class="field-label">Symbol</label>
          <input class="field-input" id="orderSym" value="AAPL">
        </div>
        <div class="two-col">
          <div class="field-group"><label class="field-label">Quantity</label>
            <input class="field-input" id="orderQty" type="number" value="10" min="1"></div>
          <div class="field-group"><label class="field-label">Type</label>
            <select class="field-input" id="orderType"><option>MARKET</option><option>LIMIT</option><option>STOP</option><option>STOP LIMIT</option></select></div>
        </div>
        <div class="field-group">
          <label class="field-label">Limit Price</label>
          <input class="field-input" id="orderPrice" type="number" step="0.01" placeholder="Market price">
        </div>
        <div class="order-summary"><span>Est. Total</span><span id="orderTotal">$1,923.50</span></div>
        <button class="order-btn buy" id="orderBtn">PLACE BUY ORDER</button>
      </div>
      <div style="padding:10px 14px;border-bottom:1px solid var(--border);flex-shrink:0;font-family:var(--mono)">
        <div style="font-size:7px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:7px">Order Cost Preview</div>
        <div style="display:flex;justify-content:space-between;font-size:9px;margin-bottom:4px"><span style="color:var(--muted)">Commission</span><span id="ocp-comm">—</span></div>
        <div style="display:flex;justify-content:space-between;font-size:9px;margin-bottom:4px"><span style="color:var(--muted)">Slippage est.</span><span id="ocp-slip">—</span></div>
        <div style="display:flex;justify-content:space-between;font-size:10px;font-weight:700;border-top:1px solid var(--border);padding-top:5px;margin-top:2px"><span style="color:var(--muted)">Net Cost</span><span id="ocp-net">—</span></div>
      </div>
    `;
    const $ = id => root.querySelector('#' + id);

    function setSide(side) {
      orderSide = side;
      $('buyTab').classList.toggle('active', side === 'buy');
      $('sellTab').classList.toggle('active', side === 'sell');
      const btn = $('orderBtn');
      btn.textContent = `PLACE ${side.toUpperCase()} ORDER`;
      btn.className = `order-btn ${side}`;
      updateSummary();
    }
    function updateSummary() {
      const sym = $('orderSym').value.toUpperCase();
      const qty = parseFloat($('orderQty').value) || 0;
      const stock = APEX.stocks.get(sym) || getStock();
      if (!stock) return;
      const limitPrice = parseFloat($('orderPrice').value) || stock.price;
      const c = APEX.costs.calc(limitPrice, qty);
      $('orderTotal').textContent = APEX.fmt.usd(c.totalCost);
      $('ocp-comm').textContent = `$${c.commission.toFixed(2)}`;
      $('ocp-slip').textContent = `$${c.slippage.toFixed(2)}`;
      $('ocp-net').textContent = `$${c.totalCost.toFixed(2)}`;
    }
    function place() {
      const sym = $('orderSym').value.toUpperCase();
      const qty = parseInt($('orderQty').value) || 0;
      const stock = APEX.stocks.get(sym) || getStock();
      if (!stock || qty <= 0) return;
      const price = stock.price;
      const c = APEX.costs.calc(price, qty);
      if (orderSide === 'buy') {
        APEX.state.applyBuy(sym, qty, price, stock.color);
        const be = price + (c.commission + c.slippage) / qty;
        APEX.state.addActivity('buy', `BUY <span class="act-sym">${qty} ${sym}</span> @$${price.toFixed(2)} · Gross $${c.gross.toLocaleString('en-US',{maximumFractionDigits:0})} · Comm $${c.commission.toFixed(2)} · Slip $${c.slippage.toFixed(2)} · <strong>Total ${APEX.fmt.usd(c.totalCost)}</strong> · BE $${be.toFixed(2)}`);
      } else {
        const avg = APEX.state.get().holdings[sym]?.avgCost || price;
        APEX.state.applySell(sym, qty, price);
        const pnl = c.totalProceeds - avg * qty; const up = pnl >= 0;
        APEX.state.addActivity('sell', `SELL <span class="act-sym">${qty} ${sym}</span> @$${price.toFixed(2)} · Gross $${c.gross.toLocaleString('en-US',{maximumFractionDigits:0})} · Comm $${c.commission.toFixed(2)} · Slip $${c.slippage.toFixed(2)} · <strong>Net ${APEX.fmt.usd(c.totalProceeds)}</strong> · P&L <strong style="color:${APEX.fmt.trendColor(up)}">${up?'+':''}$${pnl.toFixed(2)}</strong>`);
      }
      updateCash();
      const btn = $('orderBtn'); const orig = btn.textContent;
      btn.textContent = '✓ ORDER SENT'; setTimeout(() => btn.textContent = orig, 1200);
    }
    function updateCash() { $('cashDisplay').textContent = APEX.fmt.usd(APEX.state.get().cashBalance); }

    $('buyTab').addEventListener('click', () => setSide('buy'));
    $('sellTab').addEventListener('click', () => setSide('sell'));
    $('orderSym').addEventListener('change', updateSummary);
    $('orderQty').addEventListener('input', updateSummary);
    $('orderPrice').addEventListener('input', updateSummary);
    $('orderType').addEventListener('change', updateSummary);
    $('orderBtn').addEventListener('click', place);

    APEX.bus.on('stocks:tick', updateSummary);
    APEX.bus.on('state:changed', updateCash);
    APEX.bus.on('symbol:selected', () => { const s = getStock(); if (s) $('orderSym').value = s.sym; updateSummary(); });
    APEX.bus.on('orderform:set', ({ sym, qty, side, price }) => {
      if (sym) $('orderSym').value = sym;
      if (qty != null) $('orderQty').value = qty;
      if (price != null) $('orderPrice').value = price;
      if (side) setSide(side);
      updateSummary();
    });
    APEX.bus.on('orderform:place', place);
    APEX.bus.on('agent:execute', side => {
      const s = getStock(); if (!s) return;
      const cash = APEX.state.get().cashBalance;
      const h = APEX.state.get().holdings[s.sym];
      const qty = side === 'buy' ? Math.max(1, Math.floor(Math.min(cash * 0.1, 4000) / s.price)) : (h?.qty || 0);
      if (qty <= 0) {
        APEX.state.addActivity('ai', `<span class="act-sym">AGENT</span> Cannot execute — no ${side === 'buy' ? 'cash' : 'shares'}.`);
        return;
      }
      $('orderSym').value = s.sym;
      $('orderQty').value = qty;
      setSide(side);
      place();
    });

    updateCash(); updateSummary();
  },
};

// ── Holdings Mini ──
APEX.components.HoldingsMini = {
  mount(root) {
    function render() {
      const { holdings } = APEX.state.get();
      const syms = Object.keys(holdings);
      if (!syms.length) {
        root.innerHTML = `<div style="padding:10px 14px;font-size:9px;color:var(--muted);font-family:var(--mono)">No positions</div>`;
        return;
      }
      root.innerHTML = syms.map(sym => {
        const h = holdings[sym]; const s = APEX.stocks.get(sym);
        const curr = s ? s.price : h.avgCost;
        const pnl = (curr - h.avgCost) * h.qty; const up = pnl >= 0;
        return `<div class="holding-mini">
          <div class="hm-dot" style="background:${h.color};box-shadow:0 0 5px ${h.color}"></div>
          <div><div class="hm-sym">${sym}</div><div class="hm-shares">${h.qty}sh @$${h.avgCost.toFixed(2)}</div></div>
          <div><div class="hm-val">$${(h.qty*curr).toLocaleString('en-US',{maximumFractionDigits:0})}</div><div class="hm-pnl" style="color:${APEX.fmt.trendColor(up)}">${up?'+':''}$${pnl.toFixed(0)}</div></div>
        </div>`;
      }).join('');
    }
    render();
    APEX.bus.on('stocks:tick', render);
    APEX.bus.on('state:changed', render);
  },
};

// ── Recent Orders ──
APEX.components.RecentOrders = {
  mount(root) {
    function render() {
      const orders = APEX.state.get().activityEvents.filter(e => e.type === 'buy' || e.type === 'sell').slice(0, 10);

      root.innerHTML = orders.map(e => {
        const t = APEX.fmt.time(e.time);

        return `<div class="act-mini"><div class="act-icon ${e.type}">${icon}</div><div class="act-text">${e.text}</div><span class="act-time">${t}</span></div>`;
      }).join('') || `<div class="empty">No orders yet.</div>`;
    }
    render();
    APEX.bus.on('state:changed', render);
    APEX.bus.on('activity:added', render);
  },
};

        </div>`).join('');
      $('ob-bids').innerHTML = ob.bids.map(b =>

        </div>`).join('');
      root.querySelectorAll('.ob-row').forEach(el => {
        el.addEventListener('click', () => APEX.bus.emit('orderform:set', { sym: stock.sym, price: parseFloat(el.dataset.price) }));
      });
      $('ob-imb-bid').style.width = ob.bidPct + '%';
      $('ob-imb-ask').style.width = ob.askPct + '%';
      $('ob-imb-bid-pct').textContent = ob.bidPct + '% BID';
      $('ob-imb-ask-pct').textContent = ob.askPct + '% ASK';

  },
