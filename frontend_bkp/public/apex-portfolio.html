<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>APEX Markets — Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Design tokens — shared across all components */
:root {
  --bg: #030608;
  --surface: #0a0e13;
  --surface2: #111820;
  --border: #1a2535;
  --accent: #00e5ff;
  --text: #e8f0fe;
  --muted: #4a6080;
  --gain: #00ff9d;
  --loss: #ff3d71;
  --hold: #ffd700;
  --mono: 'Space Mono', monospace;
  --sans: 'Syne', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100vh;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 229, 255, 0.012) 2px, rgba(0, 229, 255, 0.012) 4px);
  pointer-events: none;
  z-index: 9999;
}

::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Common animations */
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
@keyframes flash-gain { 0% { background: rgba(0, 255, 157, 0.15); } 100% { background: transparent; } }
@keyframes flash-loss { 0% { background: rgba(255, 61, 113, 0.15); } 100% { background: transparent; } }
.flash-g { animation: flash-gain 0.7s ease-out; }
.flash-l { animation: flash-loss 0.7s ease-out; }

/* Shared col chrome */
.col {
  border-right: 1px solid var(--border);
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
  display: flex;
  flex-direction: column;
}
.col:last-child { border-right: none; }
.col-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: var(--surface);
  z-index: 10;
  flex-shrink: 0;
}
.col-title {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--muted);
}
.col-meta { font-family: var(--mono); font-size: 8px; color: var(--muted); }
.empty {
  padding: 24px 16px;
  font-size: 10px;
  color: var(--muted);
  font-family: var(--mono);
  text-align: center;
}

</style>
<style>
/* Header + ticker */
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px;
  border-bottom: 1px solid var(--border);
  background: rgba(10, 14, 19, 0.97);
  backdrop-filter: blur(12px);
  position: sticky; top: 0; z-index: 50;
  height: 52px;
}
.logo {
  font-size: 18px; font-weight: 800;
  color: var(--accent);
  text-shadow: 0 0 18px rgba(0, 229, 255, 0.4);
  letter-spacing: -0.5px;
}
.logo span { color: var(--text); }
.nav-tabs { display: flex; gap: 0; height: 100%; }
.nav-tab {
  display: flex; align-items: center;
  padding: 0 20px;
  font-family: var(--mono); font-size: 10px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  text-decoration: none;
  transition: all 0.15s;
}
.nav-tab:hover { color: var(--text); }
.nav-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.header-right {
  display: flex; align-items: center; gap: 16px;
  font-family: var(--mono); font-size: 10px; color: var(--muted);
}
.status-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--gain);
  box-shadow: 0 0 6px var(--gain);
  animation: pulse 2s infinite;
  display: inline-block; margin-right: 4px;
}
.header-time { color: var(--accent); font-size: 11px; }

.ticker-wrap {
  overflow: hidden;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 5px 0;
}
.ticker-tape {
  display: flex; gap: 36px;
  animation: ticker 32s linear infinite;
  white-space: nowrap;
  font-family: var(--mono); font-size: 10px;
}
@keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
.tick-sym { color: var(--accent); font-weight: 700; }
.tick-chg.up { color: var(--gain); }
.tick-chg.dn { color: var(--loss); }

/* Watchlist (shared) */
.wl-item {
  padding: 12px 16px;
  border-bottom: 1px solid rgba(26, 37, 53, 0.5);
  cursor: pointer;
  transition: background 0.15s;
  display: grid; grid-template-columns: 1fr auto; gap: 4px;
  align-items: center;
  flex-shrink: 0;
}
.wl-item:hover { background: var(--surface2); }
.wl-item.active { background: rgba(0, 229, 255, 0.05); border-left: 2px solid var(--accent); }
.wl-sym { font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.wl-badge {
  font-size: 7px; padding: 2px 4px; border-radius: 2px;
  font-family: var(--mono); font-weight: 700; letter-spacing: 1px;
}
.wl-badge.BUY { background: rgba(0, 255, 157, 0.15); color: var(--gain); border: 1px solid rgba(0, 255, 157, 0.3); }
.wl-badge.SELL { background: rgba(255, 61, 113, 0.15); color: var(--loss); border: 1px solid rgba(255, 61, 113, 0.3); }
.wl-badge.HOLD { background: rgba(255, 215, 0, 0.12); color: var(--hold); border: 1px solid rgba(255, 215, 0, 0.3); }
.wl-name { font-size: 9px; color: var(--muted); font-family: var(--mono); margin-top: 2px; }
.wl-price { font-family: var(--mono); font-size: 12px; text-align: right; }
.wl-chg { font-family: var(--mono); font-size: 9px; text-align: right; }

</style>
<style>
/* Portfolio hero + metrics */
.port-hero {
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(0, 229, 255, 0.03), transparent);
}
.port-label { font-size: 8px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); font-family: var(--mono); }
.port-value { font-family: var(--mono); font-size: 32px; font-weight: 700; margin: 6px 0 4px; letter-spacing: -1px; text-shadow: 0 0 30px rgba(0, 229, 255, 0.15); }
.port-daily { font-family: var(--mono); font-size: 12px; margin-bottom: 12px; }
.alloc-bar { height: 5px; background: var(--border); border-radius: 3px; display: flex; overflow: hidden; margin-bottom: 5px; }
.alloc-seg { height: 100%; transition: width 0.6s; }
.alloc-legend { font-family: var(--mono); font-size: 8px; color: var(--muted); }

.metrics-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px;
  background: var(--border);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.metric-card { background: var(--surface); padding: 13px 15px; }
.mc-label { font-size: 7px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; font-family: var(--mono); }
.mc-value { font-family: var(--mono); font-size: 15px; font-weight: 700; margin-top: 4px; }
.mc-sub { font-family: var(--mono); font-size: 8px; color: var(--muted); margin-top: 2px; }

/* Holdings table */
.holdings-table { width: 100%; border-collapse: collapse; }
.ht-head { background: var(--surface2); }
.ht-head th {
  padding: 7px 14px; font-size: 7px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--muted); font-family: var(--mono); font-weight: 700;
  text-align: left; border-bottom: 1px solid var(--border);
}
.ht-head th:not(:first-child) { text-align: right; }
.ht-row { border-bottom: 1px solid rgba(26, 37, 53, 0.4); transition: background 0.12s; }
.ht-row:hover { background: var(--surface2); }
.ht-row td { padding: 10px 14px; font-family: var(--mono); font-size: 10px; vertical-align: middle; }
.ht-row td:not(:first-child) { text-align: right; }
.ht-sym { font-weight: 700; font-size: 12px; display: flex; align-items: center; gap: 7px; }
.ht-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.ht-name { font-size: 8px; color: var(--muted); margin-top: 2px; }

/* P&L */
.pnl-chart-wrap { padding: 16px; }
.pnl-chart-title { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); font-family: var(--mono); margin-bottom: 10px; }

/* Activity */
.activity-item {
  padding: 9px 16px; border-bottom: 1px solid rgba(26, 37, 53, 0.3);
  display: flex; gap: 8px; align-items: flex-start;
}
.act-icon {
  width: 18px; height: 18px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 7px; flex-shrink: 0; margin-top: 1px;
}
.act-icon.buy { background: rgba(0, 255, 157, 0.15); color: var(--gain); border: 1px solid rgba(0, 255, 157, 0.3); }
.act-icon.sell { background: rgba(255, 61, 113, 0.15); color: var(--loss); border: 1px solid rgba(255, 61, 113, 0.3); }
.act-icon.ai { background: rgba(0, 229, 255, 0.15); color: var(--accent); border: 1px solid rgba(0, 229, 255, 0.3); }
.act-text { font-size: 9px; line-height: 1.55; flex: 1; }
.act-sym { font-weight: 700; color: var(--accent); }
.act-time { font-family: var(--mono); font-size: 8px; color: var(--muted); white-space: nowrap; }

/* CTA */
.goto-terminal {
  display: block; margin: 16px; padding: 11px;
  background: rgba(0, 229, 255, 0.08);
  border: 1px solid var(--accent); border-radius: 3px;
  color: var(--accent);
  font-family: var(--sans); font-size: 11px; font-weight: 700; letter-spacing: 2px;
  text-transform: uppercase; text-align: center; text-decoration: none;
  cursor: pointer; transition: all 0.15s;
}
.goto-terminal:hover { background: rgba(0, 229, 255, 0.15); box-shadow: 0 0 20px rgba(0, 229, 255, 0.1); }

/* Signals panel */
.signal-card { padding: 11px 16px; border-bottom: 1px solid rgba(26, 37, 53, 0.4); }
.signal-card-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
.signal-card-sym { font-weight: 700; font-size: 13px; }
.signal-card-sig { font-family: var(--mono); font-size: 16px; font-weight: 800; }
.signal-card-meta { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 8px; color: var(--muted); }
.signal-card-bar { height: 2px; background: var(--border); border-radius: 1px; margin-top: 6px; overflow: hidden; }
.signal-card-fill { height: 100%; border-radius: 1px; }

</style>
<style>
/* Auth + Prefs page styles */
.auth-shell {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 40px 20px;
  background:
    radial-gradient(ellipse at top, rgba(0, 229, 255, 0.06), transparent 60%),
    radial-gradient(ellipse at bottom, rgba(0, 255, 157, 0.04), transparent 60%);
}
.auth-card {
  width: 100%; max-width: 420px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  box-shadow: 0 0 60px rgba(0, 229, 255, 0.08), inset 0 1px 0 rgba(255,255,255,0.03);
  overflow: hidden;
}
.auth-brand {
  text-align: center;
  padding: 28px 28px 20px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(0, 229, 255, 0.04), transparent);
}
.auth-brand .logo {
  font-family: var(--sans); font-size: 22px; font-weight: 800;
  color: var(--accent);
  text-shadow: 0 0 24px rgba(0, 229, 255, 0.4);
  letter-spacing: -0.5px;
}
.auth-brand .logo span { color: var(--text); }
.auth-brand .tag {
  font-family: var(--mono); font-size: 9px;
  letter-spacing: 3px; text-transform: uppercase;
  color: var(--muted); margin-top: 6px;
}
.auth-tabs { display: flex; }
.auth-tab {
  flex: 1; padding: 14px; background: transparent; border: none;
  font-family: var(--sans); font-size: 11px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase;
  color: var(--muted); cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
}
.auth-tab:hover { color: var(--text); }
.auth-tab.active { color: var(--accent); border-bottom-color: var(--accent); background: rgba(0, 229, 255, 0.04); }
.auth-form { padding: 22px 28px 26px; display: none; }
.auth-form.active { display: block; }
.auth-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
.auth-label {
  font-family: var(--mono); font-size: 8px;
  letter-spacing: 2px; text-transform: uppercase; color: var(--muted);
}
.auth-input {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  font-family: var(--mono); font-size: 13px;
  padding: 10px 12px; border-radius: 2px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.auth-input:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.1);
}
.auth-btn {
  width: 100%; padding: 12px;
  background: var(--accent); color: var(--bg); border: none; border-radius: 2px;
  font-family: var(--sans); font-size: 12px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase; cursor: pointer;
  transition: all 0.15s;
}
.auth-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0, 229, 255, 0.3); }
.auth-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
.auth-error {
  background: rgba(255, 61, 113, 0.08);
  border: 1px solid rgba(255, 61, 113, 0.4);
  color: var(--loss);
  font-family: var(--mono); font-size: 10px;
  padding: 9px 11px; border-radius: 2px;
  margin-bottom: 14px; display: none;
}
.auth-error.show { display: block; }
.auth-success {
  background: rgba(0, 255, 157, 0.08);
  border: 1px solid rgba(0, 255, 157, 0.4);
  color: var(--gain);
  font-family: var(--mono); font-size: 10px;
  padding: 9px 11px; border-radius: 2px;
  margin-bottom: 14px; display: none;
}
.auth-success.show { display: block; }
.auth-footer {
  text-align: center; padding: 14px;
  border-top: 1px solid var(--border);
  font-family: var(--mono); font-size: 9px; color: var(--muted);
}
.auth-footer a { color: var(--accent); text-decoration: none; }

/* Preferences page */
.prefs-page {
  max-width: 880px; margin: 0 auto;
  padding: 32px 28px 80px;
}
.prefs-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  border-bottom: 1px solid var(--border);
  padding-bottom: 18px; margin-bottom: 26px;
}
.prefs-title { font-family: var(--sans); font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
.prefs-sub { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 4px; letter-spacing: 1px; }
.prefs-account {
  font-family: var(--mono); font-size: 10px; color: var(--muted); text-align: right;
}
.prefs-account strong { color: var(--accent); font-weight: 700; }

.prefs-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
}
.prefs-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 20px;
}
.prefs-section.full { grid-column: 1 / -1; }
.prefs-section-title {
  font-family: var(--mono); font-size: 9px;
  letter-spacing: 3px; text-transform: uppercase; color: var(--accent);
  margin-bottom: 4px;
}
.prefs-section-desc {
  font-size: 11px; color: var(--muted);
  margin-bottom: 18px; line-height: 1.5;
}
.prefs-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid rgba(26, 37, 53, 0.5);
  gap: 18px;
}
.prefs-row:last-child { border-bottom: none; }
.prefs-row-label { flex: 1; }
.prefs-row-name { font-size: 12px; font-weight: 600; }
.prefs-row-hint { font-family: var(--mono); font-size: 9px; color: var(--muted); margin-top: 2px; }

.seg-control { display: flex; gap: 0; border: 1px solid var(--border); border-radius: 2px; overflow: hidden; }
.seg-control button {
  background: transparent; border: none; padding: 6px 12px;
  font-family: var(--mono); font-size: 9px; letter-spacing: 1px;
  color: var(--muted); cursor: pointer;
  text-transform: uppercase; transition: all 0.15s;
}
.seg-control button:hover { color: var(--text); }
.seg-control button.active { background: var(--accent); color: var(--bg); font-weight: 700; }

.toggle {
  width: 36px; height: 20px; border-radius: 10px;
  background: var(--border); position: relative; cursor: pointer;
  transition: background 0.15s; flex-shrink: 0;
}
.toggle::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--text); transition: transform 0.18s;
}
.toggle.on { background: var(--accent); }
.toggle.on::after { transform: translateX(16px); background: var(--bg); }

.prefs-input, .prefs-select {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  font-family: var(--mono); font-size: 12px;
  padding: 7px 10px; border-radius: 2px; min-width: 140px;
}
.prefs-input:focus, .prefs-select:focus { outline: none; border-color: var(--accent); }

.prefs-actions {
  display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px;
}
.prefs-btn {
  padding: 10px 22px; border-radius: 2px; cursor: pointer;
  font-family: var(--sans); font-size: 11px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase;
  border: 1px solid var(--border); background: transparent; color: var(--text);
  transition: all 0.15s;
}
.prefs-btn:hover { border-color: var(--accent); color: var(--accent); }
.prefs-btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.prefs-btn.primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,229,255,0.25); }
.prefs-btn.danger { color: var(--loss); border-color: rgba(255,61,113,0.4); }
.prefs-btn.danger:hover { background: rgba(255,61,113,0.08); border-color: var(--loss); }

.prefs-saved {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--surface); border: 1px solid var(--gain);
  color: var(--gain);
  font-family: var(--mono); font-size: 10px; letter-spacing: 1px;
  padding: 10px 16px; border-radius: 2px;
  opacity: 0; transform: translateY(8px); pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  box-shadow: 0 0 20px rgba(0,255,157,0.2);
}
.prefs-saved.show { opacity: 1; transform: translateY(0); }

/* User chip in header */
.user-chip {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 10px; border: 1px solid var(--border); border-radius: 12px;
  font-family: var(--mono); font-size: 9px; color: var(--text);
  text-decoration: none;
  transition: border-color 0.15s;
}
.user-chip:hover { border-color: var(--accent); color: var(--accent); }
.user-chip-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--gain); box-shadow: 0 0 6px var(--gain);
}

</style>
<style>
  .portfolio-grid {
    display: grid;
    grid-template-columns: 280px 1fr 320px;
    height: calc(100vh - 52px - 28px);
  }
</style>

<body>
  <header id="hdr"></header>
  <div class="ticker-wrap"><div class="ticker-tape" id="ticker"></div></div>

  <div class="portfolio-grid">
    <!-- Watchlist -->
    <div class="col">
      <div class="col-header">
        <span class="col-title">⬛ Watchlist</span>
        <span class="col-meta" id="wlCount">10 symbols</span>
      </div>
      <div id="watchlist"></div>
      <a class="goto-terminal" href="Terminal.html">⬡ Open Trading Terminal →</a>
    </div>

    <!-- Center: Portfolio summary + holdings + P&L -->
    <div class="col">
      <div id="portHero" class="port-hero"></div>
      <div id="metrics" class="metrics-grid"></div>
      <div class="col-header" style="position:relative;border-top:0">
        <span class="col-title">⬢ Holdings</span>
        <span class="col-meta" id="holdCount">0 positions</span>
      </div>
      <div id="holdings"></div>
      <div id="pnlChart"></div>
      <div class="col-header" style="position:relative">
        <span class="col-title">◈ Activity Log</span>
        <span class="col-meta" id="actCount">0 events</span>
      </div>
      <div id="activity"></div>
    </div>

    <!-- Right: Agent signals -->
    <div class="col">
      <div class="col-header">
        <span class="col-title">⬡ Agent Signals</span>
        <span class="col-meta" id="sigCount">0 signals</span>
      </div>
      <div id="signals"></div>
    </div>
  </div>

  <!-- Lib -->
  <script>
// Event bus — decouples services from components.
// Services publish, components subscribe.
window.APEX = window.APEX || {};
APEX.bus = (function () {
  const handlers = {};
  return {
    on(evt, fn) {
      (handlers[evt] = handlers[evt] || []).push(fn);
      return () => this.off(evt, fn);
    },
    off(evt, fn) {
      handlers[evt] = (handlers[evt] || []).filter(h => h !== fn);
    },
    emit(evt, payload) {
      (handlers[evt] || []).forEach(fn => {

// Auth service — signup, login, logout, current user, preferences
window.APEX = window.APEX || {};
APEX.auth = (function () {
  const USERS_KEY = 'apex_users';
  const SESSION_KEY = 'apex_session';
  const PREFS_KEY = 'apex_prefs';

  const DEFAULT_PREFS = {
    displayName: '',
    email: '',
    riskTolerance: 'moderate',         // conservative | moderate | aggressive
    defaultOrderType: 'MARKET',
    defaultQty: 10,
    confirmOrders: true,
    notifySignals: true,
    notifyFills: true,
    theme: 'cyber',                    // cyber | minimal
    autoAnalyze: false,
    baseCurrency: 'USD',
    sessionTimeoutMin: 60,
  };

  function loadUsers() {
    try { return JSON.parse(localStorage.getItem(USERS_KEY)) || {}; } catch { return {}; }
  }
  function saveUsers(u) { localStorage.setItem(USERS_KEY, JSON.stringify(u)); }

  function hash(s) {
    // tiny non-cryptographic hash — good enough for a prototype
    let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h) ^ s.charCodeAt(i);
    return (h >>> 0).toString(16);
  }

  function signup({ email, password, displayName }) {
    email = (email || '').trim().toLowerCase();
    if (!email || !password) throw new Error('Email and password required.');
    if (password.length < 6) throw new Error('Password must be at least 6 characters.');
    const users = loadUsers();
    if (users[email]) throw new Error('An account with that email already exists.');
    users[email] = { email, displayName: displayName || email.split('@')[0], pwHash: hash(password), createdAt: new Date().toISOString() };
    saveUsers(users);
    setSession(email);
    setPrefs({ ...DEFAULT_PREFS, email, displayName: users[email].displayName });
    return users[email];
  }

  function login({ email, password }) {
    email = (email || '').trim().toLowerCase();
    const users = loadUsers();
    const u = users[email];
    if (!u || u.pwHash !== hash(password)) throw new Error('Invalid email or password.');
    setSession(email);
    if (!getPrefs()) setPrefs({ ...DEFAULT_PREFS, email, displayName: u.displayName });
    return u;
  }

  function logout() {
    localStorage.removeItem(SESSION_KEY);
    APEX.bus && APEX.bus.emit('auth:logout');
  }

  function setSession(email) {
    localStorage.setItem(SESSION_KEY, JSON.stringify({ email, ts: Date.now() }));
    APEX.bus && APEX.bus.emit('auth:login', { email });
  }

  function current() {
    try {
      const s = JSON.parse(localStorage.getItem(SESSION_KEY));
      if (!s) return null;
      const u = loadUsers()[s.email];
      return u || null;
    } catch { return null; }
  }

  function requireAuth(redirect = 'Login.html') {
    if (!current()) { window.location.href = redirect; return false; }
    return true;
  }

  function getPrefs() {
    try { return JSON.parse(localStorage.getItem(PREFS_KEY)); } catch { return null; }
  }
  function setPrefs(p) {
    localStorage.setItem(PREFS_KEY, JSON.stringify(p));
    APEX.bus && APEX.bus.emit('prefs:changed', p);
  }
  function updatePrefs(patch) {
    const p = { ...(getPrefs() || DEFAULT_PREFS), ...patch };
    setPrefs(p); return p;
  }

  return { signup, login, logout, current, requireAuth, getPrefs, setPrefs, updatePrefs, DEFAULT_PREFS };
})();

// State service — holdings, cash, activity, signals. Persisted to localStorage.
window.APEX = window.APEX || {};
APEX.state = (function () {
  const KEY = 'apex_state';
  const DEFAULT = { holdings: {}, cashBalance: 50000, activityEvents: [], agentSignals: {}, orderCount: 0 };
  let state;
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      state = s ? { ...DEFAULT, ...s } : { ...DEFAULT };
    } catch { state = { ...DEFAULT }; }
  }
  function save() {
    localStorage.setItem(KEY, JSON.stringify(state));
    APEX.bus.emit('state:changed', state);
  }
  load();

  function get() { return state; }
  function reload() { load(); APEX.bus.emit('state:changed', state); }

  function addActivity(type, text) {
    state.activityEvents.unshift({ type, text, time: new Date().toISOString() });
    if (state.activityEvents.length > 30) state.activityEvents.pop();
    save();
    APEX.bus.emit('activity:added', { type, text });
  }
  function setSignal(sym, sig) {
    state.agentSignals[sym] = sig;
    save();
    APEX.bus.emit('signal:set', { sym, sig });
  }
  function applyBuy(sym, qty, price, color) {
    if (!state.holdings[sym]) state.holdings[sym] = { qty: 0, avgCost: 0, color };
    const h = state.holdings[sym], nq = h.qty + qty;
    h.avgCost = (h.avgCost * h.qty + price * qty) / nq;
    h.qty = nq;
    state.cashBalance -= price * qty;
    state.orderCount++;
    save();
  }
  function applySell(sym, qty, price) {
    if (state.holdings[sym]) {
      state.holdings[sym].qty = Math.max(0, state.holdings[sym].qty - qty);
      if (!state.holdings[sym].qty) delete state.holdings[sym];
    }
    state.cashBalance += price * qty;
    state.orderCount++;
    save();
  }

  // Cross-tab sync
  window.addEventListener('storage', e => {
    if (e.key === KEY) { load(); APEX.bus.emit('state:changed', state); }
    if (e.key === 'apex_stocks') { APEX.stocks.reload(); APEX.bus.emit('stocks:tick', APEX.stocks.all()); }
  });

  return { get, save, reload, addActivity, setSignal, applyBuy, applySell };
})();

  <script>
// Trade cost calculator — pure functions
window.APEX = window.APEX || {};
APEX.costs = (function () {
  const COMMISSION = 0.65, COMMISSION_MIN = 1.00, SLIPPAGE_BPS = 3;
  function calc(price, qty) {
    const gross = price * qty;
    const commission = Math.max(COMMISSION_MIN, COMMISSION * qty);
    const slippage = gross * (SLIPPAGE_BPS / 10000);
    return { gross, commission, slippage, totalCost: gross + commission + slippage, totalProceeds: gross - commission - slippage };
  }
  function suggest(stock, signal, cashBalance, holding) {
    let qty;
    if (signal === 'BUY') qty = Math.max(1, Math.floor(Math.min(cashBalance * 0.10, 5000) / stock.price));
    else if (signal === 'SELL') qty = holding ? holding.qty : 0;
    else qty = Math.max(1, Math.floor(Math.min(cashBalance * 0.05, 2000) / stock.price));
    const c = calc(stock.price, qty);
    const breakeven = stock.price + (c.commission + c.slippage) / Math.max(qty, 1);
    let projectedPnl = null, projectedPct = null;
    if (holding && holding.qty > 0 && signal === 'SELL') {
      const cb = holding.avgCost * qty;
      projectedPnl = c.totalProceeds - cb;
      projectedPct = projectedPnl / cb * 100;
    }
    return { ...c, price: stock.price, suggestedQty: qty, breakeven, projectedPnl, projectedPct, holding };
  }
  return { calc, suggest, COMMISSION, COMMISSION_MIN, SLIPPAGE_BPS };
})();

          <td>$${mktVal.toLocaleString('en-US', { maximumFractionDigits: 0 })}<br><span style="font-size:8px;color:var(--muted)">${portPct}% port</span></td>
          <td style="color:${APEX.fmt.trendColor(up)}">${up ? '+' : ''}$${pnl.toFixed(2)}</td>
          <td style="color:${APEX.fmt.trendColor(up)}">${APEX.fmt.pct(pnlPct)}</td>
        </tr>`;
      }).join('');
    }
    render();
    APEX.bus.on('stocks:tick', render);
    APEX.bus.on('state:changed', render);
  },
};

APEX.components.PnlSparkline = {
  mount(root) {
    root.innerHTML = `<div class="pnl-chart-title">Portfolio P&L — Intraday</div><canvas id="pnlCanvas" height="80"></canvas>`;
    const canvas = root.querySelector('#pnlCanvas');
    function draw() {
      const data = APEX.components.PortfolioHero.getPnlHistory();
      const ctx = canvas.getContext('2d');
      const W = canvas.offsetWidth, H = 80;
      canvas.width = W * devicePixelRatio; canvas.height = H * devicePixelRatio;
      canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
      ctx.scale(devicePixelRatio, devicePixelRatio);
      ctx.clearRect(0, 0, W, H);
      if (data.length < 2) return;
      const min = Math.min(...data, 0), max = Math.max(...data, 1);
      const range = max - min || 1;
      const xS = W / (data.length - 1);
      const yS = v => H - ((v - min) / range) * H * 0.88 - H * 0.06;
      const lastVal = data[data.length - 1];
      const isUp = lastVal >= 0;
      const lc = isUp ? '#00ff9d' : '#ff3d71';
      ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, yS(0)); ctx.lineTo(W, yS(0)); ctx.stroke();
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, isUp ? 'rgba(0,255,157,0.18)' : 'rgba(255,61,113,0.18)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.beginPath(); ctx.moveTo(0, yS(data[0]));
      data.forEach((v, i) => ctx.lineTo(i * xS, yS(v)));
      ctx.lineTo((data.length - 1) * xS, H); ctx.lineTo(0, H); ctx.closePath();
      ctx.fillStyle = grad; ctx.fill();
      ctx.beginPath(); ctx.moveTo(0, yS(data[0]));
      data.forEach((v, i) => ctx.lineTo(i * xS, yS(v)));
      ctx.strokeStyle = lc; ctx.lineWidth = 2; ctx.shadowColor = lc; ctx.shadowBlur = 5; ctx.stroke(); ctx.shadowBlur = 0;
      ctx.beginPath(); ctx.arc((data.length - 1) * xS, yS(lastVal), 4, 0, Math.PI * 2);
      ctx.fillStyle = lc; ctx.shadowColor = lc; ctx.shadowBlur = 10; ctx.fill(); ctx.shadowBlur = 0;
      ctx.fillStyle = lc; ctx.font = `bold 10px 'Space Mono'`; ctx.textAlign = 'right';
      ctx.fillText(`${lastVal >= 0 ? '+' : ''}$${lastVal.toFixed(0)}`, W - 4, 14);
    }
    draw();
    setInterval(draw, 3000);
    APEX.bus.on('stocks:tick', draw);
  },
};

APEX.components.ActivityLog = {
  mount(root, { compact = false } = {}) {
    function render() {
      const events = APEX.state.get().activityEvents;
      const cnt = document.querySelector('#actCount');
      if (cnt) cnt.textContent = `${events.length} events`;
      root.innerHTML = events.slice(0, 20).map(e => {
        const ts = APEX.fmt.time(e.time);
        const icon = e.type === 'buy' ? 'B' : e.type === 'sell' ? 'S' : 'AI';
        const cls = compact ? 'act-mini' : 'activity-item';
        return `<div class="${cls}"><div class="act-icon ${e.type}">${icon}</div><div class="act-text">${e.text}</div><span class="act-time">${ts}</span></div>`;
      }).join('') || `<div class="empty">No activity yet.</div>`;
    }
    render();
    APEX.bus.on('state:changed', render);
    APEX.bus.on('activity:added', render);
  },
};

APEX.components.SignalsPanel = {
  mount(root) {
    function render() {
      const signals = APEX.state.get().agentSignals;
      const syms = Object.keys(signals);
      const cnt = document.querySelector('#sigCount');
      if (cnt) cnt.textContent = `${syms.length} signal${syms.length !== 1 ? 's' : ''}`;
      if (!syms.length) { root.innerHTML = `<div class="empty">Run analysis in the Terminal to see signals here.</div>`; return; }
      root.innerHTML = syms.map(sym => {
        const sig = signals[sym];
        const cc = APEX.fmt.signalColor(sig.signal);
        return `<div class="signal-card">
          <div class="signal-card-row">
            <span class="signal-card-sym">${sym}</span>
            <span class="signal-card-sig" style="color:${cc}">${sig.signal}</span>
          </div>
          <div class="signal-card-meta">
            <span>${sig.confidence}% confidence</span><span>${APEX.fmt.hm(sig.time)}</span>
          </div>
          <div class="signal-card-bar"><div class="signal-card-fill" style="width:${sig.confidence}%;background:${cc}"></div></div>
        </div>`;
      }).join('');
    }
    render();
    APEX.bus.on('signal:set', render);
    APEX.bus.on('state:changed', render);
  },
};

</script>

    APEX.components.Header.mount(document.getElementById('hdr'), { active: 'portfolio' });

    APEX.components.PnlSparkline.mount(document.getElementById('pnlChart'));
    APEX.components.ActivityLog.mount(document.getElementById('activity'));
    APEX.components.SignalsPanel.mount(document.getElementById('signals'));
    APEX.stocks.startSim(1400);
  </script>
